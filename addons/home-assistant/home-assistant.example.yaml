# Copy to the path in HOME_ASSISTANT_CONFIG (default var/data/home-assistant.yaml) and adapt.

cameras:
    # Camera slug in Camera diary => its Home Assistant sensors
    garden:
        name: Garden
        scene: Back garden with a lawn and a hedge. The fence at the back is the property line; behind it runs a public path.
        # binary_sensor.garden_person etc. turning "on" are detections (e.g. the Reolink integration). The types come
        # from detection_types in the Camera diary settings (default: person, animal, vehicle, motion).
        sensor_prefix: binary_sensor.garden
        detections: [person, animal, vehicle]
        # Optional: folder of continuous recordings under RECORDINGS_DIR; frames are cut at the settings' frame_offsets
        recording_folder: Garden

signals:
    # State changes near an event become hints for the AI and the search
    binary_sensor.cat_flap:
        time_attribute: since   # optional: attribute with the real time, if the state reports late
        states:
            on: The cat came in through the cat flap
            off: The cat went out through the cat flap
    lock.front_door:
        states:
            locked: Front door locked
            unlocked: Front door unlocked

# Optional, with the defaults
import:
    max_gap: 120        # seconds between detections that still join one event
    max_duration: 600   # seconds an event lasts at most
    hint_window: 180    # seconds before and after an event in which signals become its hints

# Optional: the AI verdict replaces the camera push your Home Assistant script sent (see the README)
push:
    # input_text the script sets after its push to "camera|epoch|mute 0/1|tag|group|file base|title|message"
    handover_entity: input_text.camera_push
    notify_service: mobile_app_my_phone   # notify.mobile_app_my_phone
    url: /lovelace/cameras                # where tapping the push leads
    details_title: Details                # button that opens the event in Camera diary
    loud_interruption_level: active       # unusual events; all others update silently (passive)
    mute_actions:                         # buttons kept on pushes that had them (mute 1)
        CAMERA_MUTE_1H: "That's us, mute 1 h"
    max_age: 3600                         # seconds after which a push is no longer updated
    # Per frame of an event (frame_offsets): "snapshot", or the second in the clip. The script's snapshot is taken at
    # the detection, its clip starts about four seconds later.
    frames: [snapshot, 0.5, 3.5]
