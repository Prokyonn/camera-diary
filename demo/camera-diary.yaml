# Settings of the demo home. Docker Compose uses this file; with PHP, set CAMERA_DIARY_CONFIG=demo/camera-diary.yaml.
# All keys: camera-diary.example.yaml.

ai:
    daily_call_limit: 500
    home_context: >-
        Our cat is called Luna: a brown tabby with a white chest and white paws. We are away this week; our
        neighbour Anna comes every morning to feed Luna. A fox and the neighbours' cats visit the garden.
    unusual_rule: >-
        A person on our property who does not seem to belong there, anyone on our property at night, or cats fighting
        or facing off on our property.

subjects:
    fox:
        description: a red fox

individuals:
    luna:
        label: Luna
        subject: cat
        description: brown tabby with dark stripes, a white chest, white paws, green eyes and a ringed tail with a black tip
        photos: [individuals/luna-sitting-side.jpg, individuals/luna-at-door.jpg, individuals/luna-arched.jpg]
        detection_types: [animal]
    anna:
        label: Anna
        subject: person
        description: our neighbour; a woman with short grey hair in a bright yellow raincoat
        photos: [individuals/anna-driveway.jpg]
        detection_types: [person]
