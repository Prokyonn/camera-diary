# Settings of the demo home. Docker Compose uses this file; with PHP, set CAMERA_DIARY_CONFIG=demo/camera-diary.yaml.
# All keys: camera-diary.example.yaml.

ai:
    daily_call_limit: 500
    home_context: >-
        Our cat is called Luna; she is black and white and uses the cat flap in the back door. Foxes, a hedgehog, a
        badger, a marten and the neighbours' cats visit the garden.
    unusual_rule: >-
        A person on our property who does not seem to belong there, anyone on our property at night, a cat other than
        Luna at or in the cat flap, or cats fighting or facing off on our property.

subjects:
    fox:
        description: a red fox
    hedgehog: ~
    badger: ~
    marten:
        description: a stone marten or pine marten; slim brown body, long bushy tail, pale throat patch

false_alarm_causes:
    wind:
        description: plants, branches or leaves moving in the wind

individuals:
    luna:
        label: Luna
        subject: cat
        description: black-and-white cat with a black patch over one eye, a white chest and white legs
        photos: [individuals/luna-sitting.jpg, individuals/luna-side.jpg, individuals/luna-front.jpg]
        detection_types: [animal]
