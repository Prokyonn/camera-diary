# A week in a demo home for `bin/console app:demo`. Each event is placed at the latest past occurrence of its local
# time of day, days_ago days back. Without an AI, `app:demo --recorded` stores the answers below, recorded from a
# real run with Gemini; with one, the worker describes the clips itself. The clips are openly licensed, see
# demo/CREDITS.md.

cameras:
    back-door:
        name: Back door
        scene: Trail camera facing the back door of the house with the cat flap, the bins, a low brick shed and the lawn in front. Everything in view is our property.
    shed:
        name: Shed
        scene: Infrared camera under the shed roof, looking along the storage shelves. Our property.
    side-yard:
        name: Side yard
        scene: Infrared camera low at the wooden fence of the side yard, aimed at a stone where food is put out. Our property; the fence is the boundary.
    lawn:
        name: Lawn
        scene: Day camera over the front lawn and the flower bed by the wall. Our property.
    patio:
        name: Patio
        scene: Night camera at ground level on the patio, where we scatter food for the foxes; the lawn and the park lights behind. Our property up to the hedge.
    beds:
        name: Flower beds
        scene: Infrared camera low over the back flower bed with leaf litter. Our property.
    garden:
        name: Garden
        scene: Back garden with an infrared camera; a paved path runs along a bed of ferns and potted plants. Everything in view is our property.
    woods:
        name: Woods
        scene: Wildlife camera at the edge of the woods behind the house, aimed at a tree trunk between rocks. Wild animals are expected here.
    hedge:
        name: Hedge
        scene: Daytime camera at the back hedge of the garden, aimed at an overgrown corner with shrubs and nettles. Our property.
    street:
        name: Street
        scene: Camera above the front door, looking down at the public sidewalk and the house fronts across. The sidewalk is not our property.
    parking:
        name: Parking
        scene: Camera above the garage, looking over the shared parking area and the road. Only the bollards and the paved square in front of them are ours.
    courtyard:
        name: Courtyard
        scene: High view from an upper floor over the shared courtyard; trees, a lawn, a garage roof and parked cars. Only the lawn in front of the garage is ours.

