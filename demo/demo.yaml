questions:
-   question: When did the strange grey cat come in through our cat flap?
    answer: The strange grey cat came in through the cat flap at 10:07.
    events: [demo-grey-lawn, demo-luna-path-6, demo-luna-dusk, demo-luna-flap, demo-backdoor-night, demo-luna-path-3,
        demo-luna-out]
-   question: How often did the cameras see Luna this week?
    answer: The cameras saw Luna 5 times this week, all at the Back door camera.
    events: [demo-luna-out, demo-luna-flap, demo-luna-dusk, demo-luna-path-3, demo-luna-path-6, demo-backdoor-night,
        demo-street-snow, demo-meadow-1, demo-grey-lawn, demo-grey-flap, demo-hedgehog-2, demo-marten-2]
-   question: Was there a cat fight in our garden this week?
    answer: There was a confrontation at 16:20, when two tabby cats were recorded facing off against each other on the patio
        and garden path near the bins, though no actual physical fight was seen.
    events: [demo-tomcats, demo-luna-out, demo-backdoor-night, demo-luna-flap, demo-meadow-1, demo-luna-dusk, demo-grey-lawn,
        demo-grey-flap, demo-hedgehog-2, demo-marten-2, demo-blackbird, demo-parking-cat]
-   question: Which wild animals visited us at night this week?
    answer: The wild animals that visited at night this week were foxes (including an adult and cubs), martens, a badger,
        and a hedgehog.
    events: [demo-meadow-1, demo-marten-2, demo-meadow-4, demo-badger, demo-hedgehog-5, demo-marten-5, demo-fox-woods, demo-luna-out,
        demo-backdoor-night, demo-luna-flap, demo-luna-dusk, demo-grey-lawn]
-   question: Which camera has the most false alarms, and why?
    answer: The Shed camera has the most false alarms. They are caused by a spider repeatedly crawling directly across or
        in front of the camera lens at night, brightly lit by infrared light and mistakenly detected as an animal.
    events: [demo-shed-0b, demo-shed-0a, demo-shed-1f, demo-shed-1e, demo-shed-1d, demo-shed-1c, demo-shed-1b, demo-shed-1,
        demo-shed-2, demo-shed-3, demo-backdoor-empty-0, demo-rain]
