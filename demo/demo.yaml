# A week in a demo home for `bin/console app:demo`. Each event is placed at the latest past occurrence of its local
# time of day, days_ago days back. Without an AI, `app:demo --recorded` stores the answers below, recorded from a
# real run with Gemini; with one, the worker describes the clips itself. The clips are openly licensed, see
# demo/CREDITS.md.

cameras:
    back-door:
        name: Back door
        scene: Trail camera facing the back door of the house with the cat flap, the bins, a low brick shed and the lawn in
            front. Everything in view is our property.
    shed:
        name: Shed
        scene: Infrared camera under the shed roof, looking along the storage shelves. Our property.
    side-yard:
        name: Side yard
        scene: 'Infrared camera low at the side of the house: flower pots, a small shelf and the wooden hedgehog feeding box
            against the wall. Our property.'
    lawn:
        name: Lawn
        scene: Day camera over the front lawn and the flower bed by the wall. Our property.
    patio:
        name: Patio
        scene: Camera under a garden chair on the patio, looking out over the wet tiles towards the lawn. Our property.
    woods:
        name: Woods
        scene: Wildlife camera at the edge of the woods behind the house, aimed at a tree trunk between rocks. Wild animals
            are expected here.
    hedge:
        name: Hedge
        scene: Daytime camera at the back hedge of the garden, aimed at an overgrown corner with shrubs and nettles. Our property.
    street:
        name: Street
        scene: Camera at the front window, looking at the snowy sidewalk, the tram tracks and the street. Nothing in view
            is our property.
    parking:
        name: Parking
        scene: Camera above the garage, looking over the shared parking area and the road. Only the bollards and the paved
            square in front of them are ours.
    courtyard:
        name: Courtyard
        scene: High view from an upper floor over the shared courtyard; trees, a lawn, a garage roof and parked cars. Only
            the lawn in front of the garage is ours.
    bins:
        name: Bins
        scene: Day camera low on the garden path by the green bins and the brick wall of the house; gravel, stepping stones
            and the lawn. Our property.
    meadow:
        name: Meadow
        scene: Infrared camera at the bottom of the garden, aimed at the bare ground in front of the wildflower meadow. Our
            property; wild animals come through the hedge.
    fence:
        name: Back fence
        scene: Infrared camera at the back fence, aimed at bare earth and dry grass where something has been digging. Our
            property up to the fence.
