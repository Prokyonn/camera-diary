# Questions asked on the Ask page in the recorded run. The answers are the AI's, without the dates, because
# the demo moves the events to the current week.
questions:
    - question: "When did the strange grey cat come in through our cat flap?"
      answer: "The strange grey cat entered through the cat flap at 10:07."
      events: [demo-grey-lawn, demo-mochi-flap, demo-grey-flap, demo-mochi-path-6, demo-backdoor-night, demo-mochi-out, demo-mochi-path-3, demo-mochi-dusk]
    - question: "How often was Mochi outside in the last seven days?"
      answer: "Mochi was recorded outside in five events across four days."
      events: [demo-mochi-out, demo-mochi-flap, demo-mochi-dusk, demo-mochi-path-3, demo-mochi-path-6]
    - question: "Which camera has the most false alarms, and why?"
      answer: "The Shed camera has the most false alarms, with eight recorded incidents. These alarms were caused by a spider crawling directly across the camera lens and being illuminated by infrared light."
      events: [demo-shed-0b, demo-shed-0a, demo-shed-1, demo-shed-2, demo-shed-3, demo-shed-4, demo-shed-5, demo-shed-6, demo-backdoor-empty-0, demo-rain, demo-backdoor-empty-3]
