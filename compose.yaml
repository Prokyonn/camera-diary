# Demo: docker compose up --build, then open http://localhost:8080
# Pick the AI with environment variables, e.g. export GEMINI_API_KEY=... (see README). Without any AI, the demo
# loads the answers recorded from a real run. The demo home's settings: demo/camera-diary.yaml.
# Compose also reads Symfony's .env next to this file, so values that must differ in the container are fixed here.
name: camera-diary

x-app: &app
  build: .
  image: camera-diary:local
  environment:
    # The defaults of APP_SECRET and INGEST_TOKEN are for the local demo only; set your own anywhere else.
    APP_SECRET: ${APP_SECRET:-demo-only-change-me}
    APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
    DEFAULT_URI: http://localhost:8080
    INGEST_TOKEN: ${INGEST_TOKEN:-demo-token}
    MCP_TOKEN: ${MCP_TOKEN:-}
    # The demo's MCP server is open without a token (fixed here, because .env closes it); set MCP_TOKEN anywhere else.
    MCP_OPEN: "1"
    MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
    AI_PLATFORM: ${AI_PLATFORM:-gemini}
    AI_MODEL: ${AI_MODEL:-gemini-3.8-flash}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    VERTEX_AI_API_KEY: ${VERTEX_AI_API_KEY:-}
    OLLAMA_HOST_URL: http://host.docker.internal:11434
    CAMERA_DIARY_CONFIG: /app/demo/camera-diary.yaml
  extra_hosts:
    - host.docker.internal:host-gateway
  volumes:
    - data:/app/var/data

services:
  setup:
    <<: *app
    command:
      - sh
      - -c
      - bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
        && bin/console cmsig:seal:index-create
        && if [ "$$AI_PLATFORM" = gemini ] && [ -z "$$GEMINI_API_KEY" ]; then bin/console app:demo --recorded; else bin/console app:demo; fi

  web:
    <<: *app
    ports:
      - 127.0.0.1:8080:80
    depends_on:
      setup:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: [bin/console, messenger:consume, scheduler_default, scheduler_home_assistant, --memory-limit=256M]
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully

volumes:
  data:
