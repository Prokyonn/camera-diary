# Demo: docker compose up --build, then open http://localhost:8080
# Pick the AI in a .env file next to this one (see README), e.g. AI_PLATFORM=gemini and GEMINI_API_KEY=...
name: camera-diary

x-app: &app
  build: .
  image: camera-diary:local
  environment:
    APP_SECRET: ${APP_SECRET:-demo-only-change-me}
    APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
    DEFAULT_URI: http://localhost:8080
    INGEST_TOKEN: ${INGEST_TOKEN:-demo-token}
    AI_PLATFORM: ${AI_PLATFORM:-gemini}
    AI_MODEL: ${AI_MODEL:-gemini-flash-latest}
    AI_HOME_CONTEXT: ${AI_HOME_CONTEXT:-}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    VERTEX_AI_API_KEY: ${VERTEX_AI_API_KEY:-}
    OLLAMA_HOST_URL: ${OLLAMA_HOST_URL:-http://host.docker.internal:11434}
  extra_hosts:
    - host.docker.internal:host-gateway
  volumes:
    - data:/app/var/data

services:
  setup:
    <<: *app
    command:
      - sh
      - -c
      - mkdir -p var/data/locks
        && bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
        && bin/console cmsig:seal:index-create
        && bin/console app:demo

  web:
    <<: *app
    ports:
      - 127.0.0.1:8080:80
    depends_on:
      setup:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: [bin/console, messenger:consume, scheduler_default, scheduler_home_assistant, --time-limit=3600]
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully

volumes:
  data:
